name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: "clippy, rustfmt"
          targets: "x86_64-pc-windows-msvc"

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build Release Binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Publish Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\TrayApp
          Copy-Item target\x86_64-pc-windows-msvc\release\VolumeProfileManager_TrayApp.exe publish\TrayApp\VolumeProfileManager.TrayApp.exe
          Copy-Item assets\app.ico publish\TrayApp\app.ico

      - name: Install Inno Setup
        run: choco install innosetup --version=6.0.3 -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer\VolumeProfileManager.iss

      - name: Determine Release Type
        shell: pwsh
        run: |
          $isPrerelease = "${{ github.ref_name }}".Contains('-')
          echo "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VolumeProfileManagerSetup.exe
          prerelease: ${{ env.IS_PRERELEASE == 'True' }}
          make_latest: ${{ env.IS_PRERELEASE != 'True' }}
          generate_release_notes: true
