name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93.1"
          components: "clippy, rustfmt"
          targets: "x86_64-pc-windows-msvc"

      - name: Verify Release Version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $versions = @($metadata.packages | ForEach-Object { $_.version } | Sort-Object -Unique)
          if ($versions.Count -ne 1) {
            throw "Workspace packages must use one version. Found: $($versions -join ', ')"
          }
          if ($versions[0] -ne $tagVersion) {
            throw "Release tag version '$tagVersion' does not match Cargo version '$($versions[0])'."
          }

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build Release Binary
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage Publish Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish\TrayApp
          Copy-Item target\x86_64-pc-windows-msvc\release\VolumeProfileManager_TrayApp.exe publish\TrayApp\VolumeProfileManager.TrayApp.exe
          Copy-Item assets\app.ico publish\TrayApp\app.ico

      - name: Install Inno Setup
        run: choco install innosetup --version=6.0.3 --allow-downgrade -y --no-progress

      - name: Build Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion="$version" installer\VolumeProfileManager.iss

      - name: Determine Release Type
        shell: pwsh
        run: |
          $isPrerelease = "${{ github.ref_name }}".Contains('-')
          echo "IS_PRERELEASE=$isPrerelease" >> $env:GITHUB_ENV

      - name: Stage Portable Directory
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $portableDir = "dist\VolumeProfileManager-$version-portable"
          New-Item -ItemType Directory -Force -Path "$portableDir\data"
          Copy-Item publish\TrayApp\VolumeProfileManager.TrayApp.exe "$portableDir\VolumeProfileManager.TrayApp.exe"
          Copy-Item publish\TrayApp\app.ico "$portableDir\app.ico"
          New-Item -ItemType File -Path "$portableDir\portable.flag"
          Compress-Archive -Path "$portableDir" -DestinationPath "dist\VolumeProfileManager-$version-portable.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/VolumeProfileManagerSetup.exe
            dist/VolumeProfileManager-*-portable.zip
          prerelease: ${{ env.IS_PRERELEASE == 'True' }}
          make_latest: ${{ env.IS_PRERELEASE != 'True' }}
          generate_release_notes: true
