[package]
name = "vpm-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["std", "now"] }
serde_json = "=1.0.145"
tempfile = "=3.23.0"
vpm-core = { version = "2.0.0-beta", path = "../vpm-core" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_Security", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp"] }
windows-core = "=0.62.2"
